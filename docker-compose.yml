services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xy_wealth
      POSTGRES_PASSWORD: xy_wealth
      POSTGRES_DB: xy_wealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_create_exchange_snapshots.up.sql:/docker-entrypoint-initdb.d/000001_create_exchange_snapshots.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xy_wealth -d xy_wealth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

