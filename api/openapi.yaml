openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: xy-wealth API
  version: 0.1.0
  description: 多交易所、银行及其他资产来源的统一聚合接口。
  contact:
    name: xy-wealth
    url: https://github.com/cnxianyi/xy_wealth
  license:
    name: UNLICENSED
servers:
  - url: /
    description: 当前服务
security: []
tags:
  - name: Health
    description: 服务存活与依赖就绪状态
  - name: Exchanges
    x-displayName: Exchanges
    description: 单个交易所数据
  - name: Binance
    x-displayName: Binance
    parent: Exchanges
    description: Binance 交易所接口
  - name: BinanceSpot
    x-displayName: Spot
    parent: Binance
    description: Binance Spot 接口
  - name: BinanceUSDM
    x-displayName: USDⓈ-M Futures
    parent: Binance
    description: Binance USDⓈ-M Futures 接口
  - name: BinanceCoinM
    x-displayName: COIN-M Futures
    parent: Binance
    description: Binance COIN-M Futures 接口
  - name: Bitget
    x-displayName: Bitget
    parent: Exchanges
    description: Bitget 交易所接口
  - name: BitgetSpot
    x-displayName: Spot
    parent: Bitget
    description: Bitget Spot 接口
  - name: BitgetUSDTFutures
    x-displayName: USDT-M Futures
    parent: Bitget
    description: Bitget USDT-FUTURES 接口
  - name: BitgetCoinFutures
    x-displayName: COIN-FUTURES
    parent: Bitget
    description: Bitget COIN-FUTURES 接口
  - name: BitgetUSDCFutures
    x-displayName: USDC-M Futures
    parent: Bitget
    description: Bitget USDC-FUTURES 接口
  - name: Weex
    x-displayName: Weex
    parent: Exchanges
    description: Weex 交易所接口
  - name: WeexSpot
    x-displayName: Spot
    parent: Weex
    description: Weex Spot 接口
  - name: WeexContract
    x-displayName: Contract
    parent: Weex
    description: Weex Contract（合约）接口
  - name: Summary
    description: 跨数据源聚合结果
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 存活检查
      responses:
        "200":
          description: 服务进程正常
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 就绪检查
      description: 检查 PostgreSQL 和 Redis 是否可用。
      responses:
        "200":
          description: 所有依赖均已就绪
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 至少一个依赖不可用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/exchanges/{provider}/balances:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getExchangeBalances
      summary: 获取交易所余额
      parameters:
        - name: provider
          in: path
          required: true
          description: 已注册的交易所标识
          schema:
            type: string
            enum: [binance, bitget, weex]
      responses:
        "200":
          description: 交易所余额
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeBalances"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ping:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotPing
      summary: Spot API 连通性检查
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: 交易所 Spot API 可访问
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotPing"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/time:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotServerTime
      summary: 获取 Spot 服务器时间
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: 交易所服务器时间（毫秒）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotServerTime"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/exchange-info:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotExchangeInfo
      summary: 获取 Spot 交易规则
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: symbol
          in: query
          required: false
          description: 交易对；不传则返回全部交易对
          schema:
            type: string
            examples: [BTCUSDT]
      responses:
        "200":
          description: 交易规则和交易对信息
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotExchangeInfo"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/depth:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotDepth
      summary: 获取 Spot 订单簿
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
        - name: limit
          in: query
          required: false
          description: 返回的买卖盘档位数
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
            default: 100
      responses:
        "200":
          description: 订单簿深度
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotDepth"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/klines:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotKlines
      summary: 获取 Spot K 线
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
        - name: interval
          in: query
          required: true
          description: K 线间隔
          schema:
            type: string
            enum: [1s, 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
            examples: [1m]
        - name: startTime
          in: query
          required: false
          description: 起始时间（毫秒）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: endTime
          in: query
          required: false
          description: 结束时间（毫秒）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: timeZone
          in: query
          required: false
          description: K 线时区，例如 UTC 或 UTC+8
          schema:
            type: string
            default: "0"
        - name: limit
          in: query
          required: false
          description: 返回的 K 线数量
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: K 线数据
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotKlines"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ticker/24hr:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotTicker24hr
      summary: 获取 Spot 24 小时行情
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: 24 小时价格变化统计
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotTicker24hr"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ticker/price:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotTickerPrice
      summary: 获取 Spot 最新价格
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: 最新价格
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotTickerPrice"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ticker/book:
    get:
      tags: [BinanceSpot, BitgetSpot, WeexSpot]
      operationId: getSpotBookTicker
      summary: 获取 Spot 最优买卖价
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: 最优买价和卖价
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotBookTicker"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/ping:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesPing
      summary: USDⓈ-M Futures API 连通性检查
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: USDⓈ-M Futures / Weex Contract API 可访问
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesPing"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/time:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesServerTime
      summary: 获取 USDⓈ-M Futures 服务器时间
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: 交易所 USDⓈ-M Futures / Contract 服务器时间（毫秒）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesServerTime"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/exchange-info:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesExchangeInfo
      summary: 获取 USDⓈ-M Futures 交易规则
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: USDⓈ-M Futures 交易规则、资产和交易对信息
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesExchangeInfo"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/depth:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesDepth
      summary: 获取 USDⓈ-M Futures 订单簿
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/FuturesSymbol"
        - name: limit
          in: query
          required: false
          description: 返回的买卖盘档位数；Weex Contract 仅支持 15 或 200，Bitget USDT-FUTURES 支持 1、5、15、50、100 或 150
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: USDⓈ-M Futures 订单簿深度
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesDepth"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/klines:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesKlines
      summary: 获取 USDⓈ-M Futures K 线
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/FuturesSymbol"
        - name: interval
          in: query
          required: true
          description: K 线间隔；Weex Contract 支持 1m、5m、15m、30m、1h、4h、12h、1d、1w；Bitget USDT-FUTURES 支持 1m、3m、5m、15m、30m、1h、4h、6h、12h、1d、3d、1w、1M
          schema:
            type: string
            enum: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
            examples: [1m]
        - name: startTime
          in: query
          required: false
          description: 起始时间（毫秒）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: endTime
          in: query
          required: false
          description: 结束时间（毫秒）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: timeZone
          in: query
          required: false
          description: K 线时区
          schema:
            type: string
            default: "0"
        - name: limit
          in: query
          required: false
          description: 返回的 K 线数量
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1500
            default: 500
      responses:
        "200":
          description: USDⓈ-M Futures K 线数据
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesKlines"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/ticker/24hr:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesTicker24hr
      summary: 获取 USDⓈ-M Futures 24 小时行情
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/FuturesSymbol"
      responses:
        "200":
          description: 24 小时价格变化统计
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesTicker24hr"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/ticker/price:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesTickerPrice
      summary: 获取 USDⓈ-M Futures 最新价格
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/FuturesSymbol"
      responses:
        "200":
          description: 最新价格
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesTickerPrice"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/ticker/book:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesBookTicker
      summary: 获取 USDⓈ-M Futures 最优买卖价
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/FuturesSymbol"
      responses:
        "200":
          description: 最优买价和卖价
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesBookTicker"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/premium-index:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures, WeexContract]
      operationId: getUsdmFuturesPremiumIndex
      summary: 获取 USDⓈ-M Futures 标记价格和资金费率
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/FuturesSymbol"
      responses:
        "200":
          description: 标记价格、指数价格和资金费率
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesPremiumIndex"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/account/balances:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures]
      operationId: getUsdmFuturesAccountBalances
      summary: 获取 USDⓈ-M / USDT-FUTURES 账户余额
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: USDⓈ-M / USDT-FUTURES 账户余额
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesAccountBalances"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/account/positions:
    get:
      tags: [BinanceUSDM, BitgetUSDTFutures]
      operationId: getUsdmFuturesAccountPositions
      summary: 获取 USDⓈ-M / USDT-FUTURES 账户持仓
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: symbol
          in: query
          required: false
          description: 交易对；不传则返回所有有持仓或未成交委托的交易对
          schema:
            type: string
            examples: [BTCUSDT]
      responses:
        "200":
          description: USDⓈ-M / USDT-FUTURES 账户持仓
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuturesPositions"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/futures/usdm/positions:
    get:
      tags: [WeexContract]
      operationId: getWeexContractPositions
      summary: 获取 Weex Contract 持仓
      parameters:
        - $ref: "#/components/parameters/WeexProvider"
        - name: symbol
          in: query
          required: false
          description: 交易对；不传则返回全部持仓
          schema:
