          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankSummary"
components:
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: 已注册的交易所标识
      schema:
        type: string
        enum: [binance, bitget, weex]
    BinanceProvider:
      name: provider
      in: path
      required: true
      description: Binance 交易所标识
      schema:
        type: string
        enum: [binance]
    BitgetProvider:
      name: provider
      in: path
      required: true
      description: Bitget 交易所标识
      schema:
        type: string
        enum: [bitget]
    WeexProvider:
      name: provider
      in: path
      required: true
      description: Weex 交易所标识
      schema:
        type: string
        enum: [weex]
    Symbol:
      name: symbol
      in: query
      required: true
      description: Binance、Bitget 或 Weex Spot 交易对
      schema:
        type: string
        examples: [BTCUSDT]
    FuturesSymbol:
      name: symbol
      in: query
      required: true
      description: Binance USDⓈ-M Futures、Bitget USDT-FUTURES 或 Weex Contract 交易对
      schema:
        type: string
        examples: [BTCUSDT]
    CoinMFuturesSymbol:
      name: symbol
      in: query
      required: true
      description: Binance COIN-M Futures 或 Bitget COIN-FUTURES 合约交易对
      schema:
        type: string
        examples: [BTCUSD_PERP, BTCUSD]
    USDCMFuturesSymbol:
      name: symbol
      in: query
      required: true
      description: Bitget USDC-FUTURES 合约交易对
      schema:
        type: string
        examples: [BTCPERP]
  headers:
    RequestID:
      description: 请求追踪标识
      schema:
        type: string
  responses:
    InvalidParameter:
      description: 请求参数无效
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderNotFound:
      description: 交易所 Provider 未注册
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpstreamError:
      description: 上游交易所请求失败
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EndpointNotSupported:
      description: Provider 尚未实现该接口能力
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [postgres, redis]
          properties:
            postgres:
              $ref: "#/components/schemas/CheckStatus"
            redis:
              $ref: "#/components/schemas/CheckStatus"
    CheckStatus:
      type: string
      enum: [ok, error]
    AssetBalance:
      type: object
      additionalProperties: false
      required: [symbol, free, locked, total]
      properties:
        symbol:
          type: string
          examples: [BTC]
        free:
          $ref: "#/components/schemas/DecimalString"
        locked:
          $ref: "#/components/schemas/DecimalString"
        total:
          $ref: "#/components/schemas/DecimalString"
    DecimalString:
      type: string
      description: 为避免浮点精度损失，以字符串表示的十进制金额。
      pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
      examples: ["0.12345678"]
    SpotPing:
      type: object
      additionalProperties: false
      required: [provider, status]
      properties:
        provider:
          type: string
          examples: [binance, bitget, weex]
        status:
          type: string
