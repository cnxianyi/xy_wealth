openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: xy-wealth API
  version: 0.1.0
  description: 多交易所、银行及其他资产来源的统一聚合接口。
  contact:
    name: xy-wealth
    url: https://github.com/cnxianyi/xy_wealth
  license:
    name: UNLICENSED
servers:
  - url: /
    description: 当前服务
security: []
tags:
  - name: Health
    description: 服务存活与依赖就绪状态
  - name: Exchanges
    description: 单个交易所数据
  - name: Summary
    description: 跨数据源聚合结果
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 存活检查
      responses:
        "200":
          description: 服务进程正常
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 就绪检查
      description: 检查 PostgreSQL 和 Redis 是否可用。
      responses:
        "200":
          description: 所有依赖均已就绪
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: 至少一个依赖不可用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /api/v1/exchanges/{provider}/balances:
    get:
      tags: [Exchanges]
      operationId: getExchangeBalances
      summary: 获取交易所余额
      parameters:
        - name: provider
          in: path
          required: true
          description: 已注册的交易所标识
          schema:
            type: string
            enum: [binance]
      responses:
        "200":
          description: 交易所余额
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeBalances"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ping:
    get:
      tags: [Exchanges]
      operationId: getSpotPing
      summary: Spot API 连通性检查
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: Binance Spot API 可访问
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotPing"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/time:
    get:
      tags: [Exchanges]
      operationId: getSpotServerTime
      summary: 获取 Spot 服务器时间
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: Binance 服务器时间（毫秒）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotServerTime"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/exchange-info:
    get:
      tags: [Exchanges]
      operationId: getSpotExchangeInfo
      summary: 获取 Spot 交易规则
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: symbol
          in: query
          required: false
          description: 交易对；不传则返回全部交易对
          schema:
            type: string
            examples: [BTCUSDT]
      responses:
        "200":
          description: 交易规则和交易对信息
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotExchangeInfo"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/depth:
    get:
      tags: [Exchanges]
      operationId: getSpotDepth
      summary: 获取 Spot 订单簿
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
        - name: limit
          in: query
          required: false
          description: 返回的买卖盘档位数
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
            default: 100
      responses:
        "200":
          description: 订单簿深度
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotDepth"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/klines:
    get:
      tags: [Exchanges]
      operationId: getSpotKlines
      summary: 获取 Spot K 线
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
        - name: interval
          in: query
          required: true
          description: K 线间隔
          schema:
            type: string
            enum: [1s, 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
            examples: [1m]
        - name: startTime
          in: query
          required: false
          description: 起始时间（毫秒）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: endTime
          in: query
          required: false
          description: 结束时间（毫秒）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: timeZone
          in: query
          required: false
          description: K 线时区，例如 UTC 或 UTC+8
          schema:
            type: string
            default: "0"
        - name: limit
          in: query
          required: false
          description: 返回的 K 线数量
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: K 线数据
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotKlines"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ticker/24hr:
    get:
      tags: [Exchanges]
      operationId: getSpotTicker24hr
      summary: 获取 Spot 24 小时行情
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: 24 小时价格变化统计
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotTicker24hr"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ticker/price:
    get:
      tags: [Exchanges]
      operationId: getSpotTickerPrice
      summary: 获取 Spot 最新价格
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: 最新价格
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotTickerPrice"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/exchanges/{provider}/spot/ticker/book:
    get:
      tags: [Exchanges]
      operationId: getSpotBookTicker
      summary: 获取 Spot 最优买卖价
      parameters:
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: 最优买价和卖价
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotBookTicker"
        "400":
          $ref: "#/components/responses/InvalidParameter"
        "404":
          $ref: "#/components/responses/ProviderNotFound"
        "501":
          $ref: "#/components/responses/EndpointNotSupported"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /api/v1/summary:
    get:
      tags: [Summary]
      operationId: getFullSummary
      summary: 获取全部资产来源的聚合结果
      description: Provider 之间并发查询，单个来源失败不会导致整个请求失败。
      responses:
        "200":
          description: 完整聚合快照
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullSummary"
  /api/v1/summary/exchanges:
    get:
      tags: [Summary]
      operationId: getExchangeSummary
      summary: 获取所有交易所的聚合结果
      responses:
        "200":
          description: 交易所聚合快照
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeSummary"
  /api/v1/summary/banks:
    get:
      tags: [Summary]
      operationId: getBankSummary
      summary: 获取所有银行的聚合结果
      responses:
        "200":
          description: 银行聚合快照
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankSummary"
components:
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      description: 已注册的交易所标识
      schema:
        type: string
        enum: [binance]
    Symbol:
      name: symbol
      in: query
      required: true
      description: Binance Spot 交易对
      schema:
        type: string
        examples: [BTCUSDT]
  headers:
    RequestID:
      description: 请求追踪标识
      schema:
        type: string
  responses:
    InvalidParameter:
      description: 请求参数无效
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderNotFound:
      description: 交易所 Provider 未注册
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UpstreamError:
      description: 上游交易所请求失败
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    EndpointNotSupported:
      description: Provider 尚未实现该 Spot 能力
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [postgres, redis]
          properties:
            postgres:
              $ref: "#/components/schemas/CheckStatus"
            redis:
              $ref: "#/components/schemas/CheckStatus"
    CheckStatus:
      type: string
      enum: [ok, error]
    AssetBalance:
      type: object
      additionalProperties: false
      required: [symbol, free, locked, total]
      properties:
        symbol:
          type: string
          examples: [BTC]
        free:
          $ref: "#/components/schemas/DecimalString"
        locked:
          $ref: "#/components/schemas/DecimalString"
        total:
          $ref: "#/components/schemas/DecimalString"
    DecimalString:
      type: string
      description: 为避免浮点精度损失，以字符串表示的十进制金额。
      pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
      examples: ["0.12345678"]
    SpotPing:
      type: object
      additionalProperties: false
      required: [provider, status]
      properties:
        provider:
          type: string
          examples: [binance]
        status:
          type: string
          const: ok
    SpotServerTime:
      type: object
      additionalProperties: false
      required: [provider, server_time]
      properties:
        provider:
          type: string
          examples: [binance]
        server_time:
          type: integer
          format: int64
          description: Binance 服务器时间，Unix 毫秒
    SpotExchangeInfo:
      type: object
      additionalProperties: false
      required: [provider, info]
      properties:
        provider:
          type: string
          examples: [binance]
        info:
          $ref: "#/components/schemas/ExchangeInfo"
    ExchangeInfo:
      type: object
      additionalProperties: false
      required: [timezone, symbols]
      properties:
        timezone:
          type: string
          examples: [UTC]
        server_time:
          type: integer
          format: int64
        rate_limits:
          type: array
          items:
            $ref: "#/components/schemas/RateLimit"
        exchange_filters:
          type: array
          items:
            type: object
            additionalProperties: true
        symbols:
          type: array
          items:
            $ref: "#/components/schemas/SymbolInfo"
    RateLimit:
      type: object
      additionalProperties: false
      required: [rate_limit_type, interval, interval_num, limit]
      properties:
        rate_limit_type:
          type: string
          examples: [REQUEST_WEIGHT]
        interval:
          type: string
          examples: [MINUTE]
        interval_num:
          type: integer
        limit:
          type: integer
    SymbolInfo:
      type: object
      additionalProperties: false
      required: [symbol, status, base_asset, quote_asset]
      properties:
        symbol:
          type: string
          examples: [BTCUSDT]
        status:
          type: string
          examples: [TRADING]
        base_asset:
          type: string
        base_asset_precision:
          type: integer
        quote_asset:
          type: string
        quote_precision:
          type: integer
        quote_asset_precision:
          type: integer
        base_commission_precision:
          type: integer
        quote_commission_precision:
          type: integer
        order_types:
          type: array
          items:
            type: string
        iceberg_allowed:
          type: boolean
        oco_allowed:
          type: boolean
        quote_order_qty_market_allowed:
          type: boolean
        is_spot_trading_allowed:
          type: boolean
        is_margin_trading_allowed:
          type: boolean
        filters:
          type: array
          items:
            type: object
            additionalProperties: true
        permissions:
          type: array
          items:
            type: string
        permission_sets:
          type: array
          items:
            type: array
            items:
              type: string
    SpotDepth:
      type: object
      additionalProperties: false
      required: [provider, order_book]
      properties:
        provider:
          type: string
          examples: [binance]
        order_book:
          $ref: "#/components/schemas/OrderBook"
    OrderBook:
      type: object
      additionalProperties: false
      required: [last_update_id, bids, asks]
      properties:
        last_update_id:
          type: integer
          format: int64
        bids:
          type: array
          description: 每项依次为价格和数量
          items:
            type: array
            prefixItems:
              - $ref: "#/components/schemas/DecimalString"
              - $ref: "#/components/schemas/DecimalString"
            minItems: 2
            maxItems: 2
        asks:
          type: array
          description: 每项依次为价格和数量
          items:
            type: array
            prefixItems:
              - $ref: "#/components/schemas/DecimalString"
              - $ref: "#/components/schemas/DecimalString"
            minItems: 2
            maxItems: 2
    SpotKlines:
      type: object
      additionalProperties: false
      required: [provider, klines]
      properties:
        provider:
          type: string
          examples: [binance]
        klines:
          type: array
          items:
            $ref: "#/components/schemas/Kline"
    Kline:
      type: object
      additionalProperties: false
      required: [open_time, open, high, low, close, volume, close_time, quote_asset_volume, number_of_trades, taker_buy_base_asset_volume, taker_buy_quote_asset_volume, ignore]
      properties:
        open_time:
          type: integer
          format: int64
        open:
          $ref: "#/components/schemas/DecimalString"
        high:
          $ref: "#/components/schemas/DecimalString"
        low:
          $ref: "#/components/schemas/DecimalString"
        close:
          $ref: "#/components/schemas/DecimalString"
        volume:
          $ref: "#/components/schemas/DecimalString"
        close_time:
          type: integer
          format: int64
        quote_asset_volume:
          $ref: "#/components/schemas/DecimalString"
        number_of_trades:
          type: integer
          format: int64
        taker_buy_base_asset_volume:
          $ref: "#/components/schemas/DecimalString"
        taker_buy_quote_asset_volume:
          $ref: "#/components/schemas/DecimalString"
        ignore:
          type: string
    SpotTicker24hr:
      type: object
      additionalProperties: false
      required: [provider, ticker]
      properties:
        provider:
          type: string
          examples: [binance]
        ticker:
          $ref: "#/components/schemas/Ticker24hr"
    Ticker24hr:
      type: object
      additionalProperties: false
      required: [symbol, price_change, price_change_percent, weighted_avg_price, last_price, volume, quote_volume, open_time, close_time, count]
      properties:
        symbol:
          type: string
        price_change:
          $ref: "#/components/schemas/DecimalString"
        price_change_percent:
          type: string
        weighted_avg_price:
          $ref: "#/components/schemas/DecimalString"
        prev_close_price:
          $ref: "#/components/schemas/DecimalString"
        last_price:
          $ref: "#/components/schemas/DecimalString"
        last_qty:
          $ref: "#/components/schemas/DecimalString"
        bid_price:
          $ref: "#/components/schemas/DecimalString"
        bid_qty:
          $ref: "#/components/schemas/DecimalString"
        ask_price:
          $ref: "#/components/schemas/DecimalString"
        ask_qty:
          $ref: "#/components/schemas/DecimalString"
        open_price:
          $ref: "#/components/schemas/DecimalString"
        high_price:
          $ref: "#/components/schemas/DecimalString"
        low_price:
          $ref: "#/components/schemas/DecimalString"
        volume:
          $ref: "#/components/schemas/DecimalString"
        quote_volume:
          $ref: "#/components/schemas/DecimalString"
        open_time:
          type: integer
          format: int64
        close_time:
          type: integer
          format: int64
        first_id:
          type: integer
          format: int64
        last_id:
          type: integer
          format: int64
        count:
          type: integer
    SpotTickerPrice:
      type: object
      additionalProperties: false
      required: [provider, ticker]
      properties:
        provider:
          type: string
          examples: [binance]
        ticker:
          $ref: "#/components/schemas/PriceTicker"
    PriceTicker:
      type: object
      additionalProperties: false
      required: [symbol, price]
      properties:
        symbol:
          type: string
        price:
          $ref: "#/components/schemas/DecimalString"
    SpotBookTicker:
      type: object
      additionalProperties: false
      required: [provider, ticker]
      properties:
        provider:
          type: string
          examples: [binance]
        ticker:
          $ref: "#/components/schemas/BookTicker"
    BookTicker:
      type: object
      additionalProperties: false
      required: [symbol, bid_price, bid_qty, ask_price, ask_qty]
      properties:
        symbol:
          type: string
        bid_price:
          $ref: "#/components/schemas/DecimalString"
        bid_qty:
          $ref: "#/components/schemas/DecimalString"
        ask_price:
          $ref: "#/components/schemas/DecimalString"
        ask_qty:
          $ref: "#/components/schemas/DecimalString"
    ExchangeBalances:
      type: object
      additionalProperties: false
      required: [provider, balances]
      properties:
        provider:
          type: string
          examples: [binance]
        balances:
          type: array
          items:
            $ref: "#/components/schemas/AssetBalance"
    ExchangeProviderResult:
      type: object
      additionalProperties: false
      required: [provider, status]
      properties:
        provider:
          type: string
          examples: [binance]
        status:
          $ref: "#/components/schemas/ProviderStatus"
        balances:
          type: array
          items:
            $ref: "#/components/schemas/AssetBalance"
        error:
          type: string
    BankAccount:
      type: object
      additionalProperties: false
      required: [account_id, currency, balance]
      properties:
        account_id:
          type: string
        currency:
          type: string
          examples: [CNY]
        balance:
          $ref: "#/components/schemas/DecimalString"
    BankProviderResult:
      type: object
      additionalProperties: false
      required: [provider, status]
      properties:
        provider:
          type: string
        status:
          $ref: "#/components/schemas/ProviderStatus"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BankAccount"
        error:
          type: string
    ProviderStatus:
      type: string
      enum: [ok, error]
    ExchangeSummary:
      type: object
      additionalProperties: false
      required: [generated_at, exchanges]
      properties:
        generated_at:
          type: string
          format: date-time
        exchanges:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeProviderResult"
    BankSummary:
      type: object
      additionalProperties: false
      required: [generated_at, banks]
      properties:
        generated_at:
          type: string
          format: date-time
        banks:
          type: array
          items:
            $ref: "#/components/schemas/BankProviderResult"
    FullSummary:
      type: object
      additionalProperties: false
      required: [generated_at, exchanges, banks]
      properties:
        generated_at:
          type: string
          format: date-time
        exchanges:
