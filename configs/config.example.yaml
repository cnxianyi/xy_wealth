app:
  name: xy-wealth
  environment: development

http:
  address: ":8080"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s

log:
  level: info
  encoding: json

postgres:
  dsn: "postgres://xy_wealth:xy_wealth@localhost:5432/xy_wealth?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

redis:
  address: "localhost:6379"
  password: ""
  db: 0
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

binance:
  base_url: "https://api.binance.com"
  futures_base_url: "https://fapi.binance.com"
  coin_m_futures_base_url: "https://dapi.binance.com"
  api_key: ""
  secret_key: ""
  recv_window: 5000
  http_timeout: 10s
  include_zero: false

bitget:
  base_url: "https://api.bitget.com"
  api_key: ""
  secret_key: ""
  passphrase: ""
  http_timeout: 10s
  include_zero: false

weex:
  spot_base_url: "https://api-spot.weex.com"
  contract_base_url: "https://api-contract.weex.com"
  api_key: ""
  secret_key: ""
  passphrase: ""
  http_timeout: 10s
  include_zero: false
